<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>AI Finger Counter</title>

  <!-- TensorFlow.js -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>

  <!-- Teachable Machine Image Library -->
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>

  <style>
    body {
      margin: 0;
      padding: 24px;
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f3f5f7;
      color: #17202a;
    }

    .container {
      max-width: 760px;
      margin: auto;
      background: white;
      padding: 24px;
      border-radius: 18px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.12);
    }

    h1 {
      margin-top: 0;
    }

    button {
      margin: 6px;
      padding: 12px 20px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
      background: #2d6cdf;
      color: white;
    }

    button:disabled {
      background: #aab4c3;
      cursor: not-allowed;
    }

    #webcam-container canvas {
      width: min(100%, 400px);
      height: auto;
      margin-top: 20px;
      border-radius: 14px;
      border: 3px solid #d8dee8;
    }

    .status-box {
      margin: 16px auto;
      padding: 16px;
      border-radius: 12px;
      background: #eef3f8;
    }

    #number-display {
      font-size: 64px;
      font-weight: bold;
      margin: 10px;
    }

    #confidence-display {
      font-size: 20px;
    }

    .led-panel {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin: 25px 0;
    }

    .led {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: #9ca3af;
      border: 3px solid #4b5563;
      transition: 0.2s;
    }

    .led.on {
      background: #ffd400;
      box-shadow: 0 0 20px #ffd400;
    }

    .prediction-row {
      display: grid;
      grid-template-columns: 90px 1fr 70px;
      gap: 10px;
      align-items: center;
      margin: 8px 0;
      text-align: left;
    }

    .bar-background {
      height: 14px;
      background: #e0e5eb;
      border-radius: 7px;
      overflow: hidden;
    }

    .bar {
      height: 100%;
      width: 0%;
      background: #2d6cdf;
      transition: width 0.1s;
    }

    #message {
      margin-top: 14px;
      min-height: 24px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <main class="container">

    <h1>AI Finger Counter</h1>

    <p>
      Show 0, 1, 2 or 3 fingers.
      The Arduino will turn on the matching number of LEDs.
    </p>

    <button id="connect-button" type="button">
      1. Connect Arduino
    </button>

    <button id="start-button" type="button">
      2. Start Camera
    </button>

    <button id="stop-button" type="button">
      Stop
    </button>

    <div class="status-box">
      Arduino:
      <strong id="serial-status">
        Not connected
      </strong>
    </div>

    <div id="webcam-container"></div>

    <div class="status-box">

      <div>
        Detected number:
      </div>

      <div id="number-display">
        0
      </div>

      <div id="confidence-display">
        Confidence: 0%
      </div>

    </div>

    <h3>Virtual LEDs</h3>

    <div class="led-panel">
      <div class="led" id="led-1"></div>
      <div class="led" id="led-2"></div>
      <div class="led" id="led-3"></div>
    </div>

    <div id="label-container"></div>

    <div id="message"></div>

  </main>


  <script>

    /*
      Paste your Teachable Machine URL here.

      Example:

      const MODEL_URL =
        "https://teachablemachine.withgoogle.com/models/h7tzwJGbW/";
    */

    const MODEL_URL =
      "https://teachablemachine.withgoogle.com/models/h7tzwJGbW/";


    /*
      Prediction must be at least 85%
      before being accepted.
    */

    const CONFIDENCE_THRESHOLD = 0.85;


    /*
      The same prediction must appear
      for several frames before Arduino
      receives the command.

      This prevents flickering.
    */

    const REQUIRED_STABLE_FRAMES = 5;


    let model = null;
    let webcam = null;

    let port = null;
    let writer = null;

    let aiRunning = false;
    let serialConnected = false;

    let candidateClass = "";
    let stableFrameCount = 0;

    let lastSentCommand = "";


    const connectButton =
      document.getElementById(
        "connect-button"
      );

    const startButton =
      document.getElementById(
        "start-button"
      );

    const stopButton =
      document.getElementById(
        "stop-button"
      );

    const serialStatus =
      document.getElementById(
        "serial-status"
      );

    const webcamContainer =
      document.getElementById(
        "webcam-container"
      );

    const numberDisplay =
      document.getElementById(
        "number-display"
      );

    const confidenceDisplay =
      document.getElementById(
        "confidence-display"
      );

    const labelContainer =
      document.getElementById(
        "label-container"
      );

    const message =
      document.getElementById(
        "message"
      );


    function showMessage(text) {
      message.textContent = text;
    }


    /*
      Converts Teachable Machine
      class names into numbers.
    */

    function classNameToNumber(className) {

      const normalized =
        className.trim().toLowerCase();

      const classMap = {

        "zero": 0,
        "0": 0,

        "one": 1,
        "1": 1,

        "two": 2,
        "2": 2,

        "three": 3,
        "3": 3

      };

      return classMap[normalized] ?? 0;
    }


    /*
      Updates the virtual LEDs
      shown on the webpage.
    */

    function updateVirtualLeds(
      numberOfLeds
    ) {

      for (
        let ledNumber = 1;
        ledNumber <= 3;
        ledNumber++
      ) {

        const led =
          document.getElementById(
            "led-" + ledNumber
          );

        if (
          ledNumber <= numberOfLeds
        ) {

          led.classList.add("on");

        } else {

          led.classList.remove("on");

        }
      }
    }


    /*
      Connect to Arduino
      using Web Serial.
    */

    async function connectArduino() {

      try {

        if (!("serial" in navigator)) {

          throw new Error(
            "Web Serial is not supported. Use desktop Google Chrome."
          );
        }


        port =
          await navigator.serial.requestPort();


        await port.open({
          baudRate: 9600
        });


        writer =
          port.writable.getWriter();


        serialConnected = true;


        serialStatus.textContent =
          "Connected";


        connectButton.disabled = true;


        /*
          Start with all LEDs off.
        */

        await sendCommand(
          "0",
          true
        );


        showMessage(
          "Arduino connected successfully."
        );

      } catch (error) {

        console.error(error);

        serialStatus.textContent =
          "Connection failed";

        showMessage(
          "Arduino connection failed: " +
          error.message
        );

      }
    }


    /*
      Load Teachable Machine model
      and start webcam.
    */

    async function startAI() {

      if (aiRunning) {
        return;
      }


      if (
        MODEL_URL.includes(
          "PASTE_YOUR_MODEL_URL_HERE"
        )
      ) {

        showMessage(
          "Paste your Teachable Machine model URL into the HTML code first."
        );

        return;
      }


      try {

        showMessage(
          "Loading AI model..."
        );


        const modelURL =
          MODEL_URL + "model.json";

        const metadataURL =
          MODEL_URL + "metadata.json";


        model =
          await tmImage.load(
            modelURL,
            metadataURL
          );


        webcam =
          new tmImage.Webcam(
            400,
            400,
            true
          );


        await webcam.setup();

        await webcam.play();


        webcamContainer.innerHTML =
          "";


        webcamContainer.appendChild(
          webcam.canvas
        );


        createPredictionBars(
          model.getTotalClasses()
        );


        aiRunning = true;

        startButton.disabled = true;


        showMessage(
          "AI started. Show 0, 1, 2 or 3 fingers."
        );


        window.requestAnimationFrame(
          aiLoop
        );

      } catch (error) {

        console.error(error);


        showMessage(
          "Could not start AI or camera: " +
          error.message
        );

      }
    }


    /*
      Create one probability bar
      for every Teachable Machine class.
    */

    function createPredictionBars(
      classCount
    ) {

      labelContainer.innerHTML =
        "";


      for (
        let index = 0;
        index < classCount;
        index++
      ) {

        const row =
          document.createElement(
            "div"
          );

        row.className =
          "prediction-row";


        const label =
          document.createElement(
            "span"
          );

        label.id =
          "label-" + index;

        label.textContent =
          "Class";


        const barBackground =
          document.createElement(
            "div"
          );

        barBackground.className =
          "bar-background";


        const bar =
          document.createElement(
            "div"
          );

        bar.className =
          "bar";

        bar.id =
          "bar-" + index;


        const value =
          document.createElement(
            "span"
          );

        value.id =
          "value-" + index;

        value.textContent =
          "0%";


        barBackground.appendChild(
          bar
        );


        row.appendChild(
          label
        );

        row.appendChild(
          barBackground
        );

        row.appendChild(
          value
        );


        labelContainer.appendChild(
          row
        );
      }
    }


    /*
      Main AI loop.
    */

    async function aiLoop() {

      if (!aiRunning) {
        return;
      }


      webcam.update();


      await predict();


      window.requestAnimationFrame(
        aiLoop
      );
    }


    /*
      Run Teachable Machine prediction.
    */

    async function predict() {

      const predictions =
        await model.predict(
          webcam.canvas
        );


      let bestPrediction =
        predictions[0];


      for (
        let index = 0;
        index < predictions.length;
        index++
      ) {

        const prediction =
          predictions[index];


        if (
          prediction.probability >
          bestPrediction.probability
        ) {

          bestPrediction =
            prediction;
        }


        const percentage =
          Math.round(
            prediction.probability *
            100
          );


        document.getElementById(
          "label-" + index
        ).textContent =
          prediction.className;


        document.getElementById(
          "bar-" + index
        ).style.width =
          percentage + "%";


        document.getElementById(
          "value-" + index
        ).textContent =
          percentage + "%";

      }


      processPrediction(
        bestPrediction
      );
    }


    /*
      Check confidence and stability.
    */

    async function processPrediction(
      prediction
    ) {

      const confidence =
        prediction.probability;


      confidenceDisplay.textContent =
        "Confidence: " +
        Math.round(
          confidence * 100
        ) +
        "%";


      let detectedClass =
        prediction.className;


      /*
        If prediction is uncertain,
        use Zero.
      */

      if (
        confidence <
        CONFIDENCE_THRESHOLD
      ) {

        detectedClass =
          "Zero";
      }


      /*
        Stability filtering.
      */

      if (
        detectedClass ===
        candidateClass
      ) {

        stableFrameCount++;

      } else {

        candidateClass =
          detectedClass;

        stableFrameCount = 1;
      }


      if (
        stableFrameCount <
        REQUIRED_STABLE_FRAMES
      ) {

        return;
      }


      const detectedNumber =
        classNameToNumber(
          detectedClass
        );


      numberDisplay.textContent =
        detectedNumber;


      updateVirtualLeds(
        detectedNumber
      );


      await sendCommand(
        String(
          detectedNumber
        )
      );
    }


    /*
      Send 0, 1, 2 or 3
      to Arduino.
    */

    async function sendCommand(
      command,
      forceSend = false
    ) {

      /*
        Do not repeatedly send
        the same value.
      */

      if (
        !forceSend &&
        command ===
        lastSentCommand
      ) {

        return;
      }


      lastSentCommand =
        command;


      if (
        !serialConnected ||
        !writer
      ) {

        showMessage(
          "Detected " +
          command +
          " but Arduino is not connected."
        );

        return;
      }


      try {

        const encodedCommand =
          new TextEncoder().encode(
            command
          );


        await writer.write(
          encodedCommand
        );


        showMessage(
          "Detected: " +
          command +
          " finger(s) → Arduino command sent."
        );

      } catch (error) {

        console.error(error);


        showMessage(
          "Serial communication error: " +
          error.message
        );

      }
    }


    /*
      Stop camera and turn
      all LEDs off.
    */

    async function stopEverything() {

      aiRunning = false;

      startButton.disabled =
        false;


      await sendCommand(
        "0",
        true
      );


      numberDisplay.textContent =
        "0";


      confidenceDisplay.textContent =
        "Confidence: 0%";


      updateVirtualLeds(0);


      if (webcam) {

        webcam.stop();

        webcam = null;
      }


      webcamContainer.innerHTML =
        "";


      showMessage(
        "System stopped. All LEDs are off."
      );
    }


    /*
      Buttons
    */

    connectButton.addEventListener(
      "click",
      connectArduino
    );


    startButton.addEventListener(
      "click",
      startAI
    );


    stopButton.addEventListener(
      "click",
      stopEverything
    );

  </script>

</body>
</html>
